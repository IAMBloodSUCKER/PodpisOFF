<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PodpisOFF — System Map</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/3d-force-graph@1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --bg:#05070d; --panel:rgba(10,14,24,.72); --line:#243049; --text:#e8eef8; --muted:#7d8ca5;
  --accent:#4c9aff; --good:#3fb950; --warn:#d29922; --bad:#f85149;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Chakra Petch",sans-serif;overflow:hidden}
#boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);animation:fadeOut .6s ease 1.1s both}
#boot .t{font-size:28px;letter-spacing:.04em}
#boot .s{font-family:"IBM Plex Mono",monospace;color:var(--muted);margin-top:8px;font-size:12px}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
#atm{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 500px at 15% 20%, rgba(76,154,255,.14), transparent 60%),
    radial-gradient(700px 420px at 85% 30%, rgba(188,140,255,.10), transparent 55%),
    radial-gradient(600px 400px at 50% 90%, rgba(63,185,80,.07), transparent 50%),
    linear-gradient(180deg,#05070d,#070b14 60%,#05070d);
}
#atm::before{content:"";position:absolute;inset:0;opacity:.18;
  background-image:linear-gradient(rgba(76,154,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(76,154,255,.08) 1px,transparent 1px);
  background-size:48px 48px}
#atm::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 120px 40px #05070d;pointer-events:none}
#graph{position:fixed;inset:0;z-index:1}
.panel{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:14px;padding:14px 16px;animation:rise .55s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes riseC{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translateX(-50%)}}
#left-rail{position:fixed;left:16px;top:16px;bottom:16px;width:280px;z-index:5;display:flex;flex-direction:column;gap:12px}
#identity{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:14px;padding:14px 16px}
#identity h1{margin:0;font-size:20px;letter-spacing:.03em}
#identity p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.45;font-family:"IBM Plex Mono",monospace}
#subs{flex:1;overflow:auto;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:14px;padding:12px}
#subs h2{margin:0 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.scard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.scard:hover{transform:translateY(-1px);border-color:#3a4d72}
.scard.active{border-color:var(--accent);background:rgba(76,154,255,.08)}
.scard .n{font-size:14px;font-weight:600}
.scard .b{font-size:11px;color:var(--muted);margin-top:4px;font-family:"IBM Plex Mono",monospace;line-height:1.35}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
#counts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:10px;animation:riseC .55s ease .1s both}
.chip{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:999px;padding:8px 14px;font-family:"IBM Plex Mono",monospace;font-size:12px;display:flex;align-items:center;gap:8px}
.chip .live{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);animation:pulse 1.6s infinite}
.chip .cached{background:var(--warn);box-shadow:none;animation:none}
@keyframes pulse{50%{opacity:.35}}
#stats{position:fixed;top:16px;right:16px;z-index:5;display:flex;flex-direction:column;gap:8px;min-width:160px}
.stat{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:12px;padding:10px 12px}
.stat .l{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.stat .v{font-size:22px;font-weight:600;margin-top:2px;font-family:"IBM Plex Mono",monospace}
#detail{position:fixed;right:16px;top:120px;width:320px;max-height:calc(100vh - 280px);overflow:auto;z-index:6;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:14px;padding:14px 16px;
  transform:translateX(120%);transition:transform .28s ease;opacity:.98}
#detail.open{transform:translateX(0)}
#detail h3{margin:0 0 8px;font-size:16px}
#detail .meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-bottom:10px}
#detail .body{font-size:13px;line-height:1.5;color:#c9d6ee}
#readiness{position:fixed;right:16px;bottom:16px;width:320px;max-height:200px;overflow:auto;z-index:5}
#readiness h2{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rrow{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:6px 0;border-top:1px solid rgba(36,48,73,.8);display:grid;grid-template-columns:28px 1fr;gap:6px}
.rrow .rk{color:var(--muted)}
.badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;margin-right:4px}
.badge.gap{background:rgba(248,81,73,.15);color:var(--bad)}
.badge.partial{background:rgba(210,153,34,.15);color:var(--warn)}
.badge.done{background:rgba(63,185,80,.15);color:var(--good)}
#journeys{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:min(720px,70vw);animation:riseC .55s ease .15s both}
.jbtn{position:relative;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 14px;cursor:pointer;font-family:"Chakra Petch",sans-serif;font-size:12px}
.jbtn:hover,.jbtn.on{border-color:var(--accent);background:rgba(76,154,255,.1)}
#controls{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;display:flex;gap:8px;animation:riseC .55s ease .2s both}
.cbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:7px 12px;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px}
.cbtn:hover{color:var(--text);border-color:#3a4d72}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none}
.nlab{position:absolute;transform:translate(-50%,-140%);font-family:"IBM Plex Mono",monospace;font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(5,7,13,.75);border:1px solid var(--line);white-space:nowrap;pointer-events:none}
a.maplink{color:var(--accent);text-decoration:none;font-size:12px}
@media (max-width:900px){
  #left-rail{width:auto;right:16px;bottom:auto;height:auto;max-height:42vh}
  #stats,#readiness{display:none}
  #detail{left:16px;right:16px;width:auto;top:auto;bottom:0;max-height:45vh;transform:translateY(110%)}
  #detail.open{transform:translateY(0)}
  #journeys{bottom:12px;max-width:94vw}
  #controls{display:none}
}
</style>
</head>
<body>
<div id="boot"><div><div class="t">PodpisOFF</div><div class="s">loading system map…</div></div></div>
<div id="atm"></div>
<div id="graph"></div>
<div id="labels"></div>

<div id="left-rail">
  <div id="identity">
    <h1>PodpisOFF · SubOFF</h1>
    <p id="summary"></p>
    <p style="margin-top:10px"><a class="maplink" href="./diagram.html">Open PlantUML diagram →</a></p>
  </div>
  <div id="subs"><h2>Subsystems</h2><div id="sublist"></div></div>
</div>

<div id="counts"></div>
<div id="stats"></div>
<div id="detail"><button class="cbtn" id="closeDetail" style="float:right;margin:-4px -4px 8px 8px">close</button><h3 id="dTitle"></h3><div class="meta" id="dMeta"></div><div class="body" id="dBody"></div></div>
<div id="readiness" class="panel"><h2>Production readiness</h2><div id="rlist"></div></div>
<div id="journeys"></div>
<div id="controls">
  <button class="cbtn" id="btnOrbit">orbit</button>
  <button class="cbtn" id="btnFit">fit</button>
  <button class="cbtn" id="btnClear">clear</button>
</div>

<script>
const KIND_STYLE = {
  control:   { color:"#3d5170", particles:0, speed:0.004, width:0.5 },
  data:      { color:"#d29922", particles:2, speed:0.006, width:0.7 },
  payment:   { color:"#f85149", particles:4, speed:0.011, width:0.9 },
  bandwidth: { color:"#3fb950", particles:5, speed:0.013, width:1.0 },
  sales:     { color:"#39c5cf", particles:3, speed:0.009, width:0.8 },
  auth:      { color:"#bc8cff", particles:2, speed:0.008, width:0.7 },
  infra:     { color:"#46506a", particles:0, speed:0.003, width:0.4 },
};
const K = (k) => KIND_STYLE[k] || KIND_STYLE.control;
const STATUS_COLOR = { operational:"#3fb950", beta:"#d29922", degraded:"#f85149", planned:"#8b949e" };

const FLOWS = [
  {
    id: "request",
    label: "Web request",
    caption: "Browser → edge → Spring API → Postgres",
    steps: [
      "SPA fetch('/api/…') — Vite proxy or nginx /api/",
      "Caddy (prod) → frontend nginx → backend:8080",
      "JwtAuthenticationFilter validates Bearer (except permitAll)",
      "Controller → service → JPA → PostgreSQL"
    ],
    nodes: ["spa","caddy","nginx","api","auth","postgres"]
  },
  {
    id: "oauth",
    label: "Yandex OAuth",
    caption: "Start → Yandex → callback ticket → JWT",
    steps: [
      "GET /api/auth/oauth/yandex/start (permitAll)",
      "Yandex authorize + token + /info",
      "Callback issues short-lived ticket (in-memory store)",
      "Frontend exchanges GET /ticket → AuthResponse JWT"
    ],
    nodes: ["spa","api","auth","yandex","postgres"]
  },
  {
    id: "telegram",
    label: "Telegram path",
    caption: "User ↔ Bot API ↔ webhook/poll → menus",
    steps: [
      "User opens t.me bot with link token",
      "Updates via webhook POST /api/telegram/webhook or poll every 2s",
      "TelegramBotMenuService replies; can export XLSX",
      "Notifications fan-out can also push to linked chat"
    ],
    nodes: ["tg-user","tg-api","telegram","api","postgres","notify"]
  },
  {
    id: "billing",
    label: "Pro upgrade (stub)",
    caption: "Plans real · payment URL mocked",
    steps: [
      "GET /api/billing/plans — hardcoded Free/Pro prices",
      "POST /api/billing/create-payment needs YOOKASSA_*",
      "Returns https://mock-payments.podpisoff.local/pay/{uuid}",
      "No YooKassa HTTP client / webhook in code yet"
    ],
    nodes: ["spa","api","billing","yookassa"]
  }
];

let DATA, GRAPH, groupAnchors, orbitOn = true, orbitAngle = 0, camDist = 520;
let selectedFlow = null, selectedGroup = null, liveCached = false;

async function main() {
  DATA = await fetch("./ecosystem-data.json", { cache: "no-store" }).then(r => r.json());
  document.getElementById("summary").textContent = DATA.summary;
  renderSubsystems();
  renderStats();
  renderReadiness();
  renderJourneys();
  buildGraph();
  wireUi();
  const params = new URLSearchParams(location.search);
  if (params.get("flow")) {
    const f = FLOWS.find(x => x.id === params.get("flow"));
    if (f) applyFlow(f);
  }
  refreshLive();
  setInterval(refreshLive, 20000);
  requestAnimationFrame(renderLoop);
}

function renderSubsystems() {
  const el = document.getElementById("sublist");
  el.innerHTML = DATA.groups.map(g => `
    <div class="scard" data-g="${g.id}">
      <div class="n"><span class="dot" style="background:${g.color}"></span>${g.label}</div>
      <div class="b">${g.blurb}</div>
    </div>`).join("");
  el.querySelectorAll(".scard").forEach(card => {
    card.onclick = () => {
      const id = card.dataset.g;
      selectedGroup = selectedGroup === id ? null : id;
      el.querySelectorAll(".scard").forEach(c => c.classList.toggle("active", c.dataset.g === selectedGroup));
      if (!selectedGroup) { clearSelection(); return; }
      const g = DATA.groups.find(x => x.id === selectedGroup);
      const members = DATA.nodes.filter(n => n.group === selectedGroup);
      highlightSet(new Set(members.map(n => n.id)));
      openDetail(g.label, `${members.length} components`, g.blurb + "<br/><br/>" + members.map(m => `• <b>${m.label}</b> — ${m.sublabel}`).join("<br/>"));
      GRAPH.zoomToFit(900, 110, n => n.group === selectedGroup);
    };
  });
}

function renderStats() {
  const box = document.getElementById("stats");
  box.innerHTML = DATA.headlineStats.map(s => `
    <div class="stat"><div class="l">${s.label}</div>
    <div class="v" ${s.live ? `data-stat="${s.key}"` : ""}>${s.live ? "…" : s.value}</div></div>`).join("");
  const counts = document.getElementById("counts");
  counts.innerHTML = `
    <div class="chip"><span class="live" id="liveDot"></span><span id="liveLabel">live feeds</span></div>
    <div class="chip">${DATA.nodes.length} nodes</div>
    <div class="chip">${DATA.links.length} edges</div>
    <div class="chip">${DATA.groups.length} subsystems</div>`;
}

function renderReadiness() {
  document.getElementById("rlist").innerHTML = (DATA.productionReadiness || []).map(r => `
    <div class="rrow"><div class="rk">#${r.rank}</div>
    <div><span class="badge ${r.status}">${r.status}</span><span class="badge">${r.severity}</span><b>${r.area}</b><br/>${r.why}</div></div>`).join("");
}

function renderJourneys() {
  const el = document.getElementById("journeys");
  el.innerHTML = FLOWS.map(f => `<button class="jbtn" data-flow="${f.id}">${f.label}</button>`).join("");
  el.querySelectorAll(".jbtn").forEach(b => b.onclick = () => {
    const f = FLOWS.find(x => x.id === b.dataset.flow);
    if (selectedFlow === f.id) { clearSelection(); return; }
    applyFlow(f);
  });
}

function computeGroupAnchors() {
  const ids = DATA.groups.map(g => g.id), a = {}, R = 360, n = Math.max(1, ids.length - 1);
  ids.forEach((g, i) => {
    const y = 1 - (i / n) * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), phi = i * Math.PI * (3 - Math.sqrt(5));
    a[g] = { x: Math.cos(phi) * r * R, y: y * R, z: Math.sin(phi) * r * R };
  });
  return a;
}

function clusterForce(alpha) {
  const k = alpha * 0.11;
  DATA.nodes.forEach(nd => {
    const an = groupAnchors[nd.group];
    if (!an || nd.x === undefined) return;
    nd.vx += (an.x - nd.x) * k;
    nd.vy += (an.y - nd.y) * k;
    nd.vz += (an.z - nd.z) * k;
  });
}

function groupColor(id) {
  return (DATA.groups.find(g => g.id === id) || {}).color || "#8b949e";
}

function buildGraph() {
  const nodes = DATA.nodes.map(n => ({ ...n, __liveSize: 1 }));
  const links = DATA.links.map(l => ({ ...l }));
  groupAnchors = computeGroupAnchors();

  GRAPH = ForceGraph3D()(document.getElementById("graph"))
    .graphData({ nodes, links })
    .backgroundColor("rgba(0,0,0,0)")
    .showNavInfo(false).nodeRelSize(6)
    .nodeVal(n => n.__liveSize)
    .nodeColor(n => groupColor(n.group))
    .nodeOpacity(0.95).nodeResolution(18)
    .nodeLabel(n => `<div style="font-family:IBM Plex Mono,monospace;padding:6px 8px"><b>${n.label}</b><br/>${n.sublabel}<br/><span style="opacity:.7">${n.status}</span></div>`)
    .linkColor(l => K(l.kind).color)
    .linkWidth(l => K(l.kind).width)
    .linkCurvature(0.06).linkOpacity(0.42)
    .linkDirectionalParticles(l => K(l.kind).particles)
    .linkDirectionalParticleSpeed(l => K(l.kind).speed)
    .linkDirectionalParticleColor(l => K(l.kind).color)
    .onNodeClick(n => {
      openDetail(n.label, `${n.sublabel} · ${n.status}`, n.detail);
      highlightSet(new Set([n.id, ...DATA.links.filter(l => l.source.id === n.id || l.target.id === n.id || l.source === n.id || l.target === n.id).flatMap(l => {
        const s = typeof l.source === "object" ? l.source.id : l.source;
        const t = typeof l.target === "object" ? l.target.id : l.target;
        return [s, t];
      })]));
    })
    .onBackgroundClick(clearSelection)
    .cooldownTicks(220);

  GRAPH.d3Force("charge").strength(-160);
  GRAPH.d3Force("link").distance(l => l.kind === "infra" ? 95 : l.kind === "control" ? 50 : 64);
  GRAPH.d3Force("cluster", clusterForce);
  GRAPH.d3VelocityDecay(0.32);
  GRAPH.onEngineStop(() => {
    GRAPH.zoomToFit(800, 30);
    const dist = GRAPH.cameraPosition().x ** 2 + GRAPH.cameraPosition().z ** 2;
    camDist = Math.sqrt(dist) * 0.72 || 520;
  });
  GRAPH.controls().addEventListener("start", () => { orbitOn = false; });
}

function nid(x) { return typeof x === "object" ? x.id : x; }

function highlightSet(set) {
  const g = GRAPH.graphData();
  g.nodes.forEach(n => { n.__dim = set && !set.has(n.id); });
  GRAPH.nodeColor(n => n.__dim ? "#1a2030" : groupColor(n.group))
    .linkOpacity(l => (!set || (set.has(nid(l.source)) && set.has(nid(l.target)))) ? 0.55 : 0.08);
}

function applyFlow(f) {
  selectedFlow = f.id;
  document.querySelectorAll(".jbtn").forEach(b => b.classList.toggle("on", b.dataset.flow === f.id));
  const set = new Set(f.nodes);
  highlightSet(set);
  GRAPH.zoomToFit(900, 110, n => set.has(n.id));
  openDetail(f.label, f.caption, f.steps.map((s, i) => `<b>${i + 1}.</b> ${s}`).join("<br/>"));
  history.replaceState(null, "", `?flow=${f.id}`);
}

function clearSelection() {
  selectedFlow = null; selectedGroup = null;
  document.querySelectorAll(".jbtn").forEach(b => b.classList.remove("on"));
  document.querySelectorAll(".scard").forEach(c => c.classList.remove("active"));
  highlightSet(null);
  document.getElementById("detail").classList.remove("open");
  history.replaceState(null, "", location.pathname);
}

function openDetail(title, meta, body) {
  document.getElementById("dTitle").textContent = title;
  document.getElementById("dMeta").textContent = meta;
  document.getElementById("dBody").innerHTML = body;
  document.getElementById("detail").classList.add("open");
}

function wireUi() {
  document.getElementById("closeDetail").onclick = () => document.getElementById("detail").classList.remove("open");
  document.getElementById("btnOrbit").onclick = () => { orbitOn = !orbitOn; };
  document.getElementById("btnFit").onclick = () => GRAPH.zoomToFit(800, 40);
  document.getElementById("btnClear").onclick = clearSelection;
}

async function refreshLive() {
  const endpoints = (DATA.liveEndpoints || []).filter(e => e.safe);
  if (!endpoints.length) return;
  const results = await Promise.allSettled(endpoints.map(e =>
    fetch(e.url, { cache: "no-store" }).then(x => { if (!x.ok) throw 0; return x.json(); })
  ));
  const ok = results.some(r => r.status === "fulfilled");
  liveCached = !ok;
  const dot = document.getElementById("liveDot");
  const lab = document.getElementById("liveLabel");
  if (liveCached) { dot.classList.add("cached"); lab.textContent = "cached / offline"; }
  else { dot.classList.remove("cached"); lab.textContent = "live feeds"; }

  const health = results[0];
  const el = document.querySelector('[data-stat="apiHealth"]');
  if (el && health.status === "fulfilled") {
    const st = health.value.status || health.value;
    const next = String(st);
    gsap.fromTo(el, { opacity: 0.4 }, { opacity: 1, duration: 0.4 });
    el.textContent = next;
    const apiNode = GRAPH.graphData().nodes.find(n => n.id === "api");
    if (apiNode) {
      apiNode.__liveSize = next === "UP" ? 1.6 : 1;
      GRAPH.nodeVal(n => n.__liveSize);
    }
  }

  if (results[1] && results[1].status === "fulfilled") {
    const y = !!results[1].value.yandex;
    const yn = GRAPH.graphData().nodes.find(n => n.id === "yandex");
    if (yn) yn.status = y ? "operational" : "planned";
  }
}

function syncLabels() {
  const box = document.getElementById("labels");
  const hubs = new Set(["spa","api","postgres","nginx","caddy","telegram","billing"]);
  const nodes = GRAPH.graphData().nodes.filter(n => hubs.has(n.id));
  box.innerHTML = "";
  nodes.forEach(n => {
    if (n.x === undefined) return;
    const c = GRAPH.graph2ScreenCoords(n.x, n.y, n.z);
    if (c.x < 0 || c.y < 0 || c.x > innerWidth || c.y > innerHeight) return;
    const d = document.createElement("div");
    d.className = "nlab";
    d.textContent = n.label;
    d.style.left = c.x + "px";
    d.style.top = c.y + "px";
    d.style.borderColor = groupColor(n.group);
    box.appendChild(d);
  });
}

function renderLoop() {
  if (orbitOn && GRAPH) {
    orbitAngle += 0.0010;
    const p = GRAPH.cameraPosition();
    GRAPH.cameraPosition({ x: camDist * Math.sin(orbitAngle), y: p.y, z: camDist * Math.cos(orbitAngle) });
  }
  if (GRAPH) syncLabels();
  requestAnimationFrame(renderLoop);
}

main().catch(err => {
  document.getElementById("boot").innerHTML = `<div><div class="t">Map failed</div><div class="s">${String(err)}</div></div>`;
});
</script>
</body>
</html>
