<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PodpisOFF — Ecosystem diagram</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#05070d;color:#e8eef8;font-family:"Chakra Petch",sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:rgba(10,14,24,.8);border-bottom:1px solid #243049;backdrop-filter:blur(12px)}
header h1{margin:0;font-size:18px}
header a{color:#4c9aff;text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:12px}
#wrap{position:fixed;inset:56px 0 0 0}
#wrap svg{width:100%;height:100%;display:block}
.err{padding:40px;font-family:"IBM Plex Mono",monospace;color:#f85149}
</style>
</head>
<body>
<header>
  <h1>PodpisOFF — Ecosystem (analysed)</h1>
  <a href="./index.html">← Live WebGL map</a>
</header>
<div id="wrap"></div>
<script>
async function boot() {
  const res = await fetch("./ecosystem-diagram.svg", { cache: "no-store" });
  if (!res.ok) {
    document.getElementById("wrap").innerHTML = `<div class="err">Missing ecosystem-diagram.svg — run:<br/>PROJECT_TITLE="PodpisOFF" node gen-diagram.mjs<br/>then fetch the PlantUML URL into ecosystem-diagram.svg</div>`;
    return;
  }
  const svgText = await res.text();
  const wrap = document.getElementById("wrap");
  wrap.innerHTML = svgText;
  const el = wrap.querySelector("svg");
  el.removeAttribute("width");
  el.removeAttribute("height");
  el.style.width = "100%";
  el.style.height = "100%";
  const pz = svgPanZoom(el, { fit: true, center: true, controlIconsEnabled: true, minZoom: 0.05, maxZoom: 40 });
  const refit = () => { pz.resize(); pz.updateBBox(); pz.fit(); pz.center(); };
  requestAnimationFrame(refit);
  setTimeout(refit, 200);
  window.addEventListener("resize", refit);
}
boot();
</script>
</body>
</html>
